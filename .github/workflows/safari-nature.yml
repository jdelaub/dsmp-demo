# Safari Nature (Android, safari-nature/): tests, every screen rendered, debug + release APKs.
name: safari-nature

on:
  push:
    paths: ["safari-nature/**", ".github/workflows/safari-nature.yml"]
  pull_request:
    paths: ["safari-nature/**", ".github/workflows/safari-nature.yml"]

concurrency:
  group: safari-nature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: safari-nature/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Runner Gradle settings (4 vCPU, 16 GB)
        run: |
          mkdir -p ~/.gradle
          printf 'org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\norg.gradle.workers.max=4\n' >> ~/.gradle/gradle.properties
      - name: Catalogue, progress and every screen (Robolectric)
        run: ./gradlew --console=plain :core:test :app:testDebugUnitTest
      - name: Debug and release APKs (release unsigned here)
        run: ./gradlew --console=plain :app:assembleDebug :app:assembleRelease
      - name: No Internet permission (children's app)
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          "$aapt2" dump permissions app/build/outputs/apk/debug/*.apk | tee perms.txt
          ! grep -q "android.permission.INTERNET" perms.txt
      - uses: actions/upload-artifact@v4
        with:
          name: safari-nature-debug
          path: safari-nature/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-nature-screens
          path: safari-nature/android/app/build/screens/
          retention-days: 14
